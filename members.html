<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>

<div id="site-header"></div>

<!-- 서브 배너 -->
<section class="subhero">
  <div class="arc"></div>
  <div class="wrap">
    <h1>구성원</h1>
  </div>
</section>

<!-- 소장 -->
<!-- 사진을 넣으려면 <div class="ph">○</div> 를
     <div class="ph"><img src="사진파일.jpg" alt="이름"></div> 로 바꾸세요. -->
<section class="block" style="padding:60px 0">
  <div class="wrap">
    <div class="sec-head" style="margin-bottom:36px"><h2>연구<span class="g">소장</span></h2></div>
    <div class="member-row">
      <div class="ph"><img src="김근향.png" alt="김근향 소장"></div>
      <div class="info">
        <h3>김근향</h3>
        <p class="role">연구소장 · 임상심리</p>
        <ul>
          <li>전공: 임상심리학</li>
          <li>주요 연구: 심리평가, 정서장애</li>
          <li>이메일: kh.kim@daegu.ac.kr</li>
        </ul>
      </div>
    </div>
  </div>
</section>

<!-- 운영위원 -->
<section class="block alt" style="padding:60px 0">
  <div class="wrap">
    <div class="sec-head" style="margin-bottom:36px"><h2>운영<span class="g">위원</span></h2></div>
    <div class="member-row">
      <div class="ph"><img src="정나래.png" alt="정나래 운영위원"></div>
      <div class="info">
        <h3>정나래</h3>
        <p class="role">운영위원 · 임상심리</p>
        <ul>
          <li>전공: 임상심리학</li>
          <li>주요 연구: 수용전념치료(ACT)</li>
          <li>이메일: jnr@daegu.ac.kr</li>
        </ul>
      </div>
    </div>
    <!-- 위원을 추가하려면 위 member-row 블록을 복사해 아래에 붙여넣으세요. -->
  </div>
</section>

<!-- 연구보조원 (카드형) -->
<section class="block" style="padding:60px 0">
  <div class="wrap">
    <div class="sec-head" style="margin-bottom:36px"><h2>연구 <span class="g">보조원</span></h2></div>
    <div class="team-grid">
      <div class="member"><div class="photo">A</div><div class="m-body"><h3>○○○</h3><p class="role">석사과정 연구원</p><p>데이터 수집·분석</p></div></div>
      <div class="member"><div class="photo">B</div><div class="m-body"><h3>○○○</h3><p class="role">석사과정 연구원</p><p>실험·검사 진행</p></div></div>
      <div class="member"><div class="photo">C</div><div class="m-body"><h3>○○○</h3><p class="role">학부 연구생</p><p>자료 정리·운영</p></div></div>
      <div class="member"><div class="photo">+</div><div class="m-body"><h3>구성원 추가</h3><p class="role">&nbsp;</p><p>여기에 계속 추가하세요</p></div></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="layout.js"></script>
